; dmsdiod@.ini - libsystemd unit template, instantiated once per dmsdio host
; by the [class=sdio] rule in dmsdiod.rules.
;
; %i expands to the host's name (e.g. "dmsdio0"), %v to the host node's
; absolute path dmsdio reported with it (e.g. "/dev/dmsdio0").
;
; dmsdiod exits with 0 right after its first rescan when the host has
; neither a card_detect_handler nor a poll_interval_ms - there is nothing to
; wait for - hence on-failure rather than always.
description=SD card presence on %i
exec=dmsdiod
args=%v
restart=on-failure
