; Elecrow CrowPanel ESP32 HMI 7.0" (DIS08070H): the microSD slot, an SD card in its SPI mode (the slot is wired to the SPI lines).
;
; Pins (the wiki of the board, "7.0-inch HMI Port", SD Card Slot (SPI)): SCK = GPIO12, MOSI = GPIO11, MISO = GPIO13, CS = GPIO10 (GPIO0..15 are
; port A of dmgpio: pin=PA10). None of them is used by the RGB panel, the touch panel (I2C GPIO19/20), the console or the I2S.
; The bus is GP-SPI2 of the chip, all its own: nothing else of the board is on it. One friends_group (sd): the dmspi node (friend_role spi),
; the chip select (a dmgpio output, high from the start: friend_role sd_cs) and the card. dmdma (the transfers of dmspi go by DMA), dmgpio
; and dmspi must be loaded before this driver; the host controller (SDHOST) is not touched.
; Every command of the card is one dmspi session (the bus held, the card selected, the speed of the card).
; The card has no detect line: the core looks for it at the periodic scans of dmdevmon (poll_interval_ms).
; max_clock_hz is the clock of the data transfers (the card's own limit is 25 MHz in the SPI mode); the identification runs at 400 kHz.

[sd_spi]
driver_name=dmspi
driver_order=2
friends_group=sd
friend_role=spi
instance=2
role=master
baudrate=400000
mode=0
nss_mode=soft
sck_pin=12
mosi_pin=11
miso_pin=13

[sd_cs]
driver_name=dmgpio
driver_order=2
friends_group=sd
friend_role=sd_cs
pin=PA10
mode=output
state=high

[sd_card]
driver_name=dmsdio
driver_order=5
friends_group=sd
instance=1
bus=spi
max_clock_hz=10000000
poll_interval_ms=1000
init_timeout_ms=5000
