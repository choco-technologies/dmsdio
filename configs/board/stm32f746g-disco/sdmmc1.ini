;
; STM32F746G-DISCO on-board microSD slot (CN3) on SDMMC1.
;
; Pins (UM1907, microSD section; same assignment as the ST BSP
; stm32746g_discovery_sd.c): PC8-PC11 = D0-D3, PC12 = CK, PD2 = CMD,
; PC13 = uSD_Detect (low when a card is inserted).
; AF12 = SDMMC1 on every one of these pins (RM0385 / DS10916 AF table).
; D0-D3 and CMD need pull-ups (SD Physical Layer spec, bus topology); the
; clock line does not.
;
; SDMMC1 is clocked from CLK48 (dmclk_domain_sdio): dmclk must produce
; 48 MHz (PLLQ=9 at 216 MHz), otherwise dmsdio_port refuses to start.
;
; Data moves by DMA: dmsdio_port leases DMA2 stream 3 (or 6), channel 4, from
; dmdma when the host starts, so the DMA2 controller must already be
; configured - load dmdma's configs/board/stm32f746g-disco/dma.ini (driver_order=2)
; together with this file. The dmsdio section below uses driver_order=3 so
; it is created after it.
;
; D0 (SDIO/SDMMC1_D0)
[sd0_d0]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC8
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; D1
[sd0_d1]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC9
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; D2
[sd0_d2]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC10
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; D3
[sd0_d3]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC11
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; CK - no pull-up on the clock line
[sd0_ck]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC12
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=none

; CMD
[sd0_cmd]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PD2
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; Card detect: switch to GND when a card is inserted (active low).
[sd0_cd]
driver_name=dmgpio
driver_order=2
friends_group=sd0
friend_role=card_detect
pin=PC13
mode=input
pull=up
interrupt_trigger=both_edges
interrupt_handler=sd0_card_detect

[sd0]
driver_name=dmsdio
driver_order=3
friends_group=sd0
instance=1
bus_width=4
max_clock_hz=50000000
high_speed=true
card_detect_handler=sd0_card_detect
card_detect_active_level=low
poll_interval_ms=0
