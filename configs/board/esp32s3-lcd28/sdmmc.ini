; Waveshare ESP32-S3-Touch-LCD-2.8: the microSD slot (TF1) on the SD/MMC host (SDHOST) of the ESP32-S3, slot 0, 1-bit bus. The pins are the
; vendor's (the demo uses SD_MMC in the 1-bit mode with CLK = 14, CMD = 17, D0 = 16 and drives D3 high):
;   CLK = GPIO14, CMD = GPIO17, D0 = GPIO16, D3 (the CS of the SPI mode of a card) = GPIO21. The slot has no card detect line the host can
;   see: the core looks for a card at the periodic scans of dmdevmon (poll_interval_ms).
; The 4-bit bus does not work on this board: with d1_pin=18 d2_pin=15 the card's first block on four lines (its status, ACMD13) has no valid
; start bit on the lines; the vendor's demo does not use them either. The 1-bit bus in the High Speed mode reads about 2.8 MB/s.
; The SD/MMC host routes its signals to the pads through the GPIO matrix (clk_pin, cmd_pin, d0_pin; d1_pin, d2_pin and d3_pin for 4 bits). With
; d3_pin alone the host holds D3 high itself: a card with its CS (DAT3) low at the first command goes to the SPI mode and does not answer
; in the SD mode - the host does it, a dmgpio friend would not (dmgpio has no initial level of an output). The pull-ups of the lines are on
; the board. Select this file OR another board's, never both. The card is a bus of its own: no dmdma is needed (the host has its internal DMA).

[sd_card]
driver_name=dmsdio
driver_order=3
friends_group=sd0
instance=1
bus_width=1
max_clock_hz=40000000
high_speed=true
clk_pin=14
cmd_pin=17
d0_pin=16
d3_pin=21
poll_interval_ms=1000
