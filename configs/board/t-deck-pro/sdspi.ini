; LILYGO T-Deck Pro: the microSD slot, an SD card in its SPI mode (the slot is wired to the SPI lines, not to the SD/MMC host of the chip).
;
; The card is on the bus of the e-paper (GP-SPI2: SCK GPIO36, MOSI GPIO33, MISO GPIO47) and joins its friends_group (epd) like the LoRa radio does:
; the bus is the dmspi node (friend_role spi) and the chip select (GPIO48 = PD0) is the dmgpio output of the section [sd_cs] of the display's ini
; (display.ini of dmuc8253: the card must be deselected from the start, or it answers the display; it only needs the friend_role sd_cs there).
; Every command of the card is one dmspi session (the bus held, the card selected, the speed of the card), so the display and the radio use the
; bus between the commands. dmgpio, dmspi and dmuc8253 (its ini) must be loaded before this driver; dmsdio_port is needed by the module, but the
; host controller (SDHOST) is not touched.
; The card has no detect line: the core looks for it at the periodic scans of dmdevmon (poll_interval_ms).
; max_clock_hz is the clock of the data transfers (the card's own limit is 25 MHz in the SPI mode); the identification runs at 400 kHz.

[sd_card]
driver_name=dmsdio
driver_order=5
friends_group=epd
instance=1
bus=spi
max_clock_hz=10000000
poll_interval_ms=1000
; some cards need more than the default 1000 ms for their power-up
init_timeout_ms=5000
