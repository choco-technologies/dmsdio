;
; STM32F407G-DISC1 with an external microSD breakout on SDIO.
;
; Pins: PC8-PC11 = D0-D3, PC12 = CK, PD2 = CMD (the only SDIO pin mapping of
; STM32F407, RM0090 / DS8626 AF table, AF12), card detect wired to PD3.
; Wire the breakout's card-detect switch to PD3 and GND; if the breakout has
; no switch, remove the [sd0_cd] section and set poll_interval_ms instead.
;
; PC10 and PC12 are also routed to the on-board CS43L22 audio DAC (I2S3
; SCK/SD). Keep the codec in reset (PD4 low, its reset state) while the SD
; card is used.
;
; SDIO is clocked from PLL48CLK (dmclk_domain_sdio): dmclk must produce
; 48 MHz (PLLQ=7 at 168 MHz), otherwise dmsdio_port refuses to start.
;
; Data moves by DMA: dmsdio_port leases DMA2 stream 3 (or 6), channel 4, from
; dmdma when the host starts, so the DMA2 controller must already be
; configured - load dmdma's configs/board/stm32f4-discovery/dma.ini (driver_order=2)
; together with this file. The dmsdio section below uses driver_order=3 so
; it is created after it.
;
; D0 (SDIO/SDMMC1_D0)
[sd0_d0]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC8
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; D1
[sd0_d1]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC9
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; D2
[sd0_d2]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC10
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; D3
[sd0_d3]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC11
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; CK - no pull-up on the clock line
[sd0_ck]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PC12
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=none

; CMD
[sd0_cmd]
driver_name=dmgpio
driver_order=2
friends_group=sd0
pin=PD2
mode=alternate
alternate_function=12
speed=maximum
output_circuit=push_pull
pull=up

; Card detect: switch to GND when a card is inserted (active low).
[sd0_cd]
driver_name=dmgpio
driver_order=2
friends_group=sd0
friend_role=card_detect
pin=PD3
mode=input
pull=up
interrupt_trigger=both_edges
interrupt_handler=sd0_card_detect

[sd0]
driver_name=dmsdio
driver_order=3
friends_group=sd0
instance=1
bus_width=4
max_clock_hz=50000000
high_speed=true
card_detect_active_level=low
; Presence monitoring policy (dmdrvi monitor contract), carried out by
; dmdevfs' dmdevmon service: the card detect edge interrupt instead of polling.
monitor_event_handler=sd0_card_detect
poll_interval_ms=0
